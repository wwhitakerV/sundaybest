services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sundaybest
      POSTGRES_PASSWORD: sundaybest
      POSTGRES_DB: sundaybest
    ports:
      - "5433:5432"
    volumes:
      - sundaybest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sundaybest -d sundaybest"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sundaybest-postgres:
